<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  (() => {
    const saved = localStorage.getItem("stt-theme");
    document.documentElement.dataset.theme = saved === "light" || saved === "dark"
      ? saved
      : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  })();
</script>
<title>3D 대시보드</title>
<link rel="stylesheet" href="/webgpu.css">
<style>
  html, body { height: 100%; overflow: hidden; }

  /* 레퍼런스와 같은 구성 — 캔버스는 alpha:true 로 투명하고 하늘은 그 뒤 CSS 그라디언트다.
     씬에 fog·background 를 두지 않으므로 원경이 탁해지지 않는다. */
  #sky { position: fixed; inset: 0; z-index: 0;
         background: linear-gradient(#8e9db8 0%, #b9c5d8 38%, #dbe3ee 72%, #e8edf4 100%); }
  #scene { position: fixed; inset: 0; display: block; z-index: 1; cursor: grab;
           touch-action: none; user-select: none; }
  #scene.is-hovering { cursor: pointer; }
  #scene.is-dragging { cursor: grabbing; }
  #scene:focus-visible { outline: 3px solid var(--accent); outline-offset: -4px; }
  #pins  { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .hud   { z-index: 3; }

  /* 라벨은 three 스프라이트가 아니라 DOM 이다 — 한글이 캔버스 텍스처보다 훨씬 또렷하고
     기기 폰트를 그대로 쓴다. 매 프레임 월드 좌표를 투영해 위치만 갱신한다. */
  .pin { position: absolute; left: 0; top: 0; transform-origin: 50% 100%;
         display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
         padding: 4px 9px; border-radius: 999px;
         font-size: .72rem; font-weight: 700; line-height: 1.25; color: #eaeef7;
         background: rgba(12, 16, 25, .86); border: 1px solid rgba(255,255,255,.16);
         box-shadow: 0 4px 14px rgba(0,0,0,.38);
         transition: opacity .16s linear; }
  .pin i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .pin .n { color: var(--muted); font-weight: 650; }
  .pin.sm { font-size: .66rem; padding: 3px 8px; }
  .pin[hidden] { display: none; }
  .pin.off { opacity: 0; }
  body.lbl-far .pin.sm { opacity: 0; }

  .hud { position: fixed; inset: 0; pointer-events: none; display: grid;
         grid-template-columns: 1fr 348px; grid-template-rows: auto 1fr auto; gap: 16px; padding: 16px; }
  .hud > * { pointer-events: auto; }
  .glass {
    border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    border-radius: var(--r-lg);
    background: color-mix(in srgb, var(--card) 72%, transparent);
    backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }

  .topbar-hud { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 14px; min-height: 50px; }
  .topbar-hud h1 { margin: 0; font-size: 1rem; font-weight: 750; }

  .side { grid-column: 2; grid-row: 2 / 4; display: grid; gap: 12px; align-content: start;
          overflow: auto; max-height: calc(100vh - 84px); scrollbar-width: thin; }

  .foot { grid-column: 1; grid-row: 3; display: flex; align-items: center; gap: 10px;
          padding: 0 12px; min-height: 42px; width: max-content; }

  .layers { grid-column: 1; grid-row: 2; align-self: start; width: max-content; padding: 10px 12px; display: grid; gap: 8px; }
  .layer { display: flex; align-items: center; gap: 9px; font-size: .82rem; font-weight: 650; cursor: pointer; }
  .layer input { accent-color: var(--accent); width: 15px; height: 15px; }
  .layer .sw { width: 10px; height: 10px; border-radius: 3px; }

  #detail[hidden] { display: none; }
  .phase-path { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: stretch; gap: 5px; min-width: 0; }
  .sr-only { position: fixed; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
  .endpoint-state { display: inline-flex; align-items: center; gap: 5px; min-width: 88px; border: 1px dashed var(--line); border-radius: var(--r-sm); padding: 5px 7px; color: var(--muted); font-size: .68rem; font-weight: 700; white-space: nowrap; }
  .endpoint-state.done { border-style: solid; border-color: var(--ok-line); color: var(--ok); }
  .endpoint-state.run { border-style: solid; border-color: var(--accent-line); background: var(--accent-subtle); color: var(--accent); }
  .endpoint-state.fail { border-style: solid; border-color: var(--bad-line); color: var(--bad); }
  .endpoint-state.hold { border-style: solid; border-color: var(--hold-line); color: var(--hold); }
  @media (max-width: 820px) {
    .hud { grid-template-columns: 1fr; gap: 8px; padding: 8px; }
    .topbar-hud { flex-wrap: wrap; padding: 8px 10px; }
    .topbar-hud .btns { order: 3; width: 100%; }
    .side { grid-column: 1; grid-row: 2 / 4; width: min(330px, calc(100vw - 16px)); justify-self: end;
            max-height: calc(100vh - 112px); }
    .layers { grid-column: 1; grid-row: 2; }
    .foot { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .pin { transition: none; }
  }
</style>
</head>
<body>
<div id="sky"></div>
<canvas id="scene" tabindex="0" role="img" aria-label="전사·번역 파이프라인 3D 운영 현황" aria-describedby="scene-help"></canvas>
<p id="scene-help" class="sr-only">방향키로 이동하고 더하기와 빼기 키로 확대하거나 축소합니다. Home 키로 시점을 초기화합니다. 상세 작업은 오른쪽 패널과 2D 대시보드에서도 확인할 수 있습니다.</p>
<div id="pins"></div>

<div class="hud">
  <header class="glass topbar-hud">
    <h1>대시보드</h1>
    <span class="btns" style="gap: 5px; flex-wrap: wrap">
      <a class="b run dot" href="/jobs?state=running">진행 중 <span data-count="running">0</span></a>
      <a class="b wait dot" href="/jobs?state=waiting">대기 <span data-count="waiting">0</span></a>
      <a class="b hold dot" href="/jobs?state=paused">일시 정지 <span data-count="paused">0</span></a>
      <a class="b hold dot" href="/jobs?state=blocked">중단 <span data-count="blocked">0</span></a>
      <a class="b hold dot" href="/jobs?state=stopped">정지 <span data-count="stopped">0</span></a>
      <a class="b bad dot" href="/jobs?state=failed">실패 <span data-count="failed">0</span></a>
      <a class="b ok dot" href="/jobs?state=done">완료 <span data-count="completed">0</span></a>
    </span>
    <span id="data-status" class="b hold dot" style="margin-left: auto">데이터 확인 중</span>
    <span id="renderer-status" class="b hold dot">렌더러 확인 중</span>
    <a class="btn sec sm" href="/media">미디어 선택</a>
    <button type="button" class="btn sec sm" id="refresh">새로고침</button>
    <a class="btn sec sm" href="/?view=2d">2D 대시보드</a>
  </header>

  <aside class="glass layers">
    <label class="layer"><input type="checkbox" data-layer="media" checked><span class="sw" style="background: #c9a98a"></span>미디어</label>
    <label class="layer"><input type="checkbox" data-layer="stations" checked><span class="sw" style="background: var(--accent)"></span>파이프라인</label>
    <label class="layer"><input type="checkbox" data-layer="queue" checked><span class="sw" style="background: var(--warn-strong)"></span>대기 큐</label>
    <label class="layer"><input type="checkbox" data-layer="gpu" checked><span class="sw" style="background: #7dd3fc"></span>GPU</label>
    <label class="layer"><input type="checkbox" data-layer="paused" checked><span class="sw" style="background: var(--hold)"></span>일시 정지</label>
    <label class="layer"><input type="checkbox" data-layer="blocked" checked><span class="sw" style="background: var(--hold)"></span>중단</label>
    <label class="layer"><input type="checkbox" data-layer="stopped" checked><span class="sw" style="background: var(--muted)"></span>정지</label>
    <label class="layer"><input type="checkbox" data-layer="failed" checked><span class="sw" style="background: var(--bad)"></span>실패</label>
    <label class="layer"><input type="checkbox" data-layer="done" checked><span class="sw" style="background: var(--ok)"></span>완료</label>
  </aside>

  <div class="side">
    <section class="glass" id="detail" hidden>
      <div class="card-head"><h2>선택</h2><span id="detail-badge" class="b"></span></div>
      <div class="card-body" id="detail-body"></div>
    </section>

    <section class="glass">
      <div class="card-head"><h2>GPU</h2><span class="sub code" data-gpu="name">확인 중</span></div>
      <div class="card-body">
          <div class="pn inset" style="padding: 11px">
            <span class="pn-l">사용률</span>
            <span class="pn-v" style="font-size: 1.5rem" data-gpu="util">—</span>
            <div class="bar" style="margin-top: 7px"><i data-gpu-bar="util" style="width: 0"></i></div>
          </div>
          <div class="pn inset" style="padding: 11px; margin-top: 8px">
            <span class="pn-l">메모리</span>
            <span class="pn-v" style="font-size: 1.5rem" data-gpu="memory">—</span>
            <span class="pn-d" data-gpu="memory_detail">사용량 확인 중</span>
            <div class="bar" style="margin-top: 7px"><i data-gpu-bar="memory" style="width: 0"></i></div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px">
            <div class="pn inset"><span class="pn-l">온도</span><span class="pn-v" style="font-size: 1.1rem" data-gpu="temperature">—</span></div>
            <div class="pn inset"><span class="pn-l">전력</span><span class="pn-v" style="font-size: 1.1rem" data-gpu="power">—</span></div>
          </div>
      </div>
    </section>
  </div>

  <footer class="glass foot">
    <button type="button" class="btn sec sm" id="reset">시점 초기화</button>
    <span class="sub">드래그 이동 · Shift+드래그 회전 · 휠 확대 · 방향키 이동</span>
  </footer>
</div>

<noscript><p class="glass" style="position: fixed; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 16px">3D 대시보드에는 JavaScript가 필요합니다.</p></noscript>

<script type="importmap">
{ "imports": { "three": "/vendor/three.webgpu.min.js" } }
</script>

<script src="/webgpu-data.js"></script>
<script type="module" src="/webgpu-scene.js"></script>
</body>
</html>
