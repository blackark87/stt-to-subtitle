<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STT to Subtitle</title>
    <link rel="stylesheet" href="/app.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">STT TO SUBTITLE</p>
          <h1>작업 현황</h1>
        </div>
        <span id="connection" class="status">연결 확인 중</span>
      </header>

      <section aria-labelledby="summary-title">
        <h2 id="summary-title">상태</h2>
        <div id="summary" class="summary" aria-live="polite"></div>
      </section>

      <section aria-labelledby="jobs-title">
        <div class="section-heading">
          <h2 id="jobs-title">최근 작업</h2>
          <button id="refresh" type="button">새로고침</button>
        </div>
        <div class="table-wrap">
          <table class="jobs-table">
            <thead>
              <tr>
                <th>파일</th>
                <th>단계</th>
                <th>상태</th>
                <th>Runtime</th>
                <th>갱신</th>
              </tr>
            </thead>
            <tbody id="jobs">
              <tr><td colspan="5">불러오는 중</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section aria-labelledby="runtimes-title">
        <div class="section-heading">
          <h2 id="runtimes-title">전사 Runtime</h2>
        </div>
        <form id="runtime-form" class="runtime-form">
          <label>
            이름
            <input name="name" required maxlength="80" placeholder="GPU Runtime 02">
          </label>
          <label>
            API 주소
            <input name="base_url" required type="url" placeholder="http://runtime-host:8100">
          </label>
          <label>
            API 토큰
            <input name="token" type="password" autocomplete="new-password">
          </label>
          <label>
            할당 슬롯
            <input name="capacity" type="number" min="1" max="8" value="1">
          </label>
          <div class="form-actions">
            <button id="runtime-submit" type="submit">Runtime 추가</button>
            <button id="runtime-cancel" type="button" hidden>취소</button>
          </div>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Runtime</th>
                <th>상태</th>
                <th>API 주소</th>
                <th>작업</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody id="runtimes">
              <tr><td colspan="5">불러오는 중</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <p id="error" class="error" role="alert" hidden></p>
    </main>
  </body>
</html>
