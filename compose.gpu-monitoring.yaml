services:
  backend:
    environment:
      GPU_PROMETHEUS_URL: ${GPU_PROMETHEUS_URL:-http://prometheus:9090}
    networks:
      gpu-monitoring:
        ipv4_address: ${BACKEND_GPU_MONITORING_IPV4:-172.22.0.5}

networks:
  gpu-monitoring:
    name: ${GPU_MONITORING_NETWORK:-gpu-monitoring}
    external: true
