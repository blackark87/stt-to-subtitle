name: ${STT_RUNTIME_PROJECT_NAME:-stt-runtime}

services:
  runtime-base:
    profiles:
      - build
    platform: linux/amd64
    image: ${STT_RUNTIME_BASE_IMAGE:-stt-to-subtitle-runtime-base:py311-cuda-v4}
    build:
      context: ${WORKSPACE:-.}
      dockerfile: Dockerfile.stt-runtime
      cache_from:
        - type=local,src=${STT_RUNTIME_CACHE_PATH:-/data/cache/buildkit/stt-runtime-py311-cuda-v4}

  runtime:
    platform: linux/amd64
    build:
      context: ${WORKSPACE:-.}
      dockerfile: Dockerfile.runtime
      args:
        STT_RUNTIME_BASE_IMAGE: ${STT_RUNTIME_BASE_IMAGE:-stt-to-subtitle-runtime-base:py311-cuda-v4}
    user: "${RUNTIME_PUID:-${PUID:-1000}}:${RUNTIME_PGID:-${PGID:-1000}}"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${STT_RUNTIME_BIND_ADDRESS:-0.0.0.0}:${STT_RUNTIME_PORT:-8100}:8100"
    environment:
      HF_TOKEN: ${HF_TOKEN:?HF_TOKEN must be set}
      STT_API_TOKEN: ${STT_API_TOKEN:-}
      STT_RUNTIME_ID: ${STT_RUNTIME_ID:?STT_RUNTIME_ID must be set}
      STT_RUNTIME_NAME: ${STT_RUNTIME_NAME:-외부 Runtime}
      STT_HOST: 0.0.0.0
      STT_PORT: 8100
      STT_STATE_DIR: /var/lib/stt
      STT_WORK_DIR: /var/lib/stt-work
      STT_DEVICE: ${STT_DEVICE:-cuda}
      STT_DIARIZATION_DEVICE: ${STT_DIARIZATION_DEVICE:-cuda}
      STT_BATCH_SIZE: ${STT_BATCH_SIZE:-8}
      WHISPERX_BATCH_SIZE: ${WHISPERX_BATCH_SIZE:-8}
      STT_THREADS: ${STT_THREADS:-8}
      STT_PROGRESS_INTERVAL_SECONDS: ${STT_PROGRESS_INTERVAL_SECONDS:-30}
      STT_CHUNK_PROGRESS_EVERY: ${STT_CHUNK_PROGRESS_EVERY:-10}
      STT_MODEL_IDLE_TIMEOUT_SECONDS: ${STT_MODEL_IDLE_TIMEOUT_SECONDS:-900}
      STT_NOISE_FILTER_TRIGGER_LEVEL: ${STT_NOISE_FILTER_TRIGGER_LEVEL:-7.0}
      STT_DEBUG_ARTIFACTS: ${STT_DEBUG_ARTIFACTS:-false}
      HF_HOME: /var/cache/stt/huggingface
      PYANNOTE_CACHE: /var/cache/stt/pyannote
      TORCH_HOME: /var/cache/stt/torch
      WHISPERX_PYTHON: /opt/venvs/whisperx/bin/python
      WHISPERJAV_PYTHON: /opt/venvs/whisperjav/bin/python
      WHISPERX_MODEL: ${WHISPERX_MODEL:-large-v3}
      WHISPERX_LANGUAGE: ${WHISPERX_LANGUAGE:-ja}
      WHISPERX_COMPUTE_TYPE: ${WHISPERX_COMPUTE_TYPE:-float16}
      WHISPERX_CACHE_DIR: /var/cache/stt/whisperx
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - type: bind
        source: ${STT_STATE_PATH:?STT_STATE_PATH must be set}
        target: /var/lib/stt
        bind:
          create_host_path: false
      - type: bind
        source: ${STT_WORK_PATH:?STT_WORK_PATH must be set}
        target: /var/lib/stt-work
        bind:
          create_host_path: false
      - type: bind
        source: ${MODEL_CACHE_PATH:?MODEL_CACHE_PATH must be set}
        target: /var/cache/stt
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=1g,mode=1777
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
