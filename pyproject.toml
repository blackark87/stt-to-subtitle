[build-system]
requires = ["setuptools==75.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-to-subtitle"
version = "3.1.0"
description = "Distributed local transcription, translation, and styled subtitle pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
stt-transcribe = "stt_to_subtitle.cli:main"
stt-api = "stt_to_subtitle.stt_api:main"
stt-web = "stt_to_subtitle.web_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stt_to_subtitle = ["templates/*.html", "static/*.css", "static/*.js"]
