[build-system]
requires = ["setuptools==75.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-to-subtitle"
version = "4.0.0"
description = "Distributed local transcription, translation, and styled subtitle pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.scripts]
stt-transcribe = "stt_to_subtitle.cli:main"
stt-backend = "stt_to_subtitle.backend_api:main"
stt-runtime = "stt_to_subtitle.stt_api:main"
# Compatibility alias for exported host runtimes and existing operators.
stt-api = "stt_to_subtitle.stt_api:main"
stt-check-migrations = "stt_to_subtitle.migration_check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"stt_to_subtitle.vendor.whisperjav" = ["LICENSE", "NOTICES", "VENDOR.md"]
"stt_to_subtitle.vendor.whisperjav.data.hallucination_filters" = ["*.json"]
