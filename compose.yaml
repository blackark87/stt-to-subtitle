name: stt-to-subtitle

services:
  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.web
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      stt:
        condition: service_healthy
        restart: true
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      MEDIA_ROOT: /media
      WEB_STATE_DIR: /var/lib/stt
      WEB_ADMIN_PASSWORD: ${WEB_ADMIN_PASSWORD:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-}
      WEB_SECURE_COOKIE: ${WEB_SECURE_COOKIE:-false}
      STT_BASE_URL: http://stt:8100
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_TOKEN: ${OPENAI_COMPATIBLE_TOKEN:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      TRANSLATION_BATCH_SEGMENTS: ${TRANSLATION_BATCH_SEGMENTS:-30}
      TRANSLATION_BATCH_CHARACTERS: ${TRANSLATION_BATCH_CHARACTERS:-6000}
    volumes:
      - ${MEDIA_PATH:-./media}:/media:rw
      - ${WEB_STATE_PATH:-./var/web-state}:/var/lib/stt:rw
    tmpfs:
      - /tmp:size=256m,mode=1777

  stt:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      HF_TOKEN: ${HF_TOKEN:?HF_TOKEN must be set}
      STT_HOST: 0.0.0.0
      STT_PORT: 8100
      STT_STATE_DIR: /var/lib/stt
      STT_DEVICE: ${STT_DEVICE:-cuda}
      STT_DIARIZATION_DEVICE: ${STT_DIARIZATION_DEVICE:-cuda}
      STT_BATCH_SIZE: ${STT_BATCH_SIZE:-1}
      STT_PROGRESS_INTERVAL_SECONDS: ${STT_PROGRESS_INTERVAL_SECONDS:-30}
      STT_CHUNK_PROGRESS_EVERY: ${STT_CHUNK_PROGRESS_EVERY:-10}
      STT_NOISE_FILTER_TRIGGER_LEVEL: ${STT_NOISE_FILTER_TRIGGER_LEVEL:-7.0}
      STT_DEBUG_ARTIFACTS: ${STT_DEBUG_ARTIFACTS:-false}
      HF_HOME: /var/cache/stt/huggingface
      PYANNOTE_CACHE: /var/cache/stt/pyannote
      TORCH_HOME: /var/cache/stt/torch
      WHISPERX_PYTHON: /opt/venvs/whisperx/bin/python
      WHISPERX_MODEL: ${WHISPERX_MODEL:-large-v3}
      WHISPERX_LANGUAGE: ${WHISPERX_LANGUAGE:-ja}
      WHISPERX_COMPUTE_TYPE: ${WHISPERX_COMPUTE_TYPE:-float16}
      WHISPERX_CACHE_DIR: /var/cache/stt/whisperx
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - ${STT_STATE_PATH:-./var/stt-state}:/var/lib/stt:rw
      - ${MODEL_CACHE_PATH:-./var/model-cache}:/var/cache/stt:rw
    tmpfs:
      - /tmp:size=1g,mode=1777
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
