name: stt-to-subtitle

services:
  runtime-base:
    profiles:
      - build
    platform: linux/amd64
    image: ${STT_RUNTIME_BASE_IMAGE:-${STT_RUNTIME_IMAGE:-stt-to-subtitle-runtime-base:py311-cuda-v4}}
    build:
      context: ${WORKSPACE:-.}
      dockerfile: Dockerfile.stt-runtime
      cache_from:
        - type=local,src=${STT_RUNTIME_CACHE_PATH:-/data/cache/buildkit/stt-runtime-py311-cuda-v4-20260825}

  web:
    platform: linux/amd64
    build:
      context: ${WORKSPACE:-.}
      dockerfile: Dockerfile.web
    user: "${WEB_PUID:-1000}:${WEB_PGID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    expose:
      - "8080"
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}
      traefik.http.routers.stt-to-subtitle.rule: "Host(`${TRAEFIK_HOST:?TRAEFIK_HOST must be set}`)"
      traefik.http.routers.stt-to-subtitle.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.stt-to-subtitle.tls: "true"
      traefik.http.routers.stt-to-subtitle.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.stt-to-subtitle.service: stt-to-subtitle
      traefik.http.routers.stt-to-subtitle.middlewares: lan-only@file
      traefik.http.services.stt-to-subtitle.loadbalancer.server.port: "8080"
    environment:
      # Next 의 rewrite 가 /api/v1 을 backend 로 넘긴다.
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-http://backend:8080}
      NODE_ENV: production
    tmpfs:
      # read_only 유지. Next standalone 서버는 /tmp 외에 런타임 쓰기가 없다
      # (이미지 최적화는 next.config.ts 에서 껐다).
      - /tmp:size=64m,mode=1777
    networks:
      - app
      - traefik

  backend:
    platform: linux/amd64
    build:
      context: ${WORKSPACE:-.}
      dockerfile: Dockerfile.backend
    user: "${BACKEND_PUID:-${WEB_PUID:-1026}}:${BACKEND_PGID:-${WEB_PGID:-100}}"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      runtime:
        condition: service_healthy
        restart: true
    expose:
      - "8080"
    environment:
      MEDIA_ROOT: /media
      BACKEND_STATE_DIR: /var/lib/stt
      BACKEND_WORK_DIR: /var/lib/stt-work
      BACKEND_FORWARDED_ALLOW_IPS: "${BACKEND_FORWARDED_ALLOW_IPS:-*}"
      STT_BASE_URL: http://runtime:8100
      STT_API_TOKEN: ${STT_API_TOKEN:-}
      TRANSLATION_STATE_DIR: /var/lib/stt-translation
      TRANSLATION_BUILTIN_NAME: ${TRANSLATION_BUILTIN_NAME:-기본 서버}
      TRANSLATION_BUILTIN_BASE_URL: ${TRANSLATION_BUILTIN_BASE_URL:-}
      TRANSLATION_BUILTIN_TOKEN: ${TRANSLATION_BUILTIN_TOKEN:-}
      TRANSLATION_BUILTIN_CAPACITY: ${TRANSLATION_BUILTIN_CAPACITY:-1}
      TRANSLATION_BUILTIN_DRAFT_ENABLED: ${TRANSLATION_BUILTIN_DRAFT_ENABLED:-true}
      TRANSLATION_BUILTIN_DRAFT_MODEL: ${TRANSLATION_BUILTIN_DRAFT_MODEL:-gemma-4-12b-coder-fable5-composer2.5-v1-uncensored-heretic}
      TRANSLATION_BUILTIN_REVIEW_MODEL: ${TRANSLATION_BUILTIN_REVIEW_MODEL:-gemma-4-26b-a4b-it-ultra-uncensored-heretic}
      TRANSLATION_BUILTIN_REVIEW_ENABLED: ${TRANSLATION_BUILTIN_REVIEW_ENABLED:-false}
      TRANSLATION_BUILTIN_DRAFT_BATCH_PREFERRED: ${TRANSLATION_BUILTIN_DRAFT_BATCH_PREFERRED:-false}
      TRANSLATION_BUILTIN_REVIEW_BATCH_PREFERRED: ${TRANSLATION_BUILTIN_REVIEW_BATCH_PREFERRED:-false}
      TRANSLATION_CONNECT_TIMEOUT_SECONDS: ${TRANSLATION_CONNECT_TIMEOUT_SECONDS:-10}
      TRANSLATION_READ_TIMEOUT_SECONDS: ${TRANSLATION_READ_TIMEOUT_SECONDS:-600}
      GPU_PROMETHEUS_URL: ${GPU_PROMETHEUS_URL:-}
      GPU_PROMETHEUS_TOKEN: ${GPU_PROMETHEUS_TOKEN:-}
      GPU_METRICS_REFRESH_SECONDS: ${GPU_METRICS_REFRESH_SECONDS:-10}
      GPU_METRICS_TIMEOUT_SECONDS: ${GPU_METRICS_TIMEOUT_SECONDS:-3}
      TRANSLATION_BATCH_SEGMENTS: ${TRANSLATION_BATCH_SEGMENTS:-30}
      TRANSLATION_BATCH_CHARACTERS: ${TRANSLATION_BATCH_CHARACTERS:-6000}
      BACKEND_AUDIO_WORKERS: ${BACKEND_AUDIO_WORKERS:-${WEB_AUDIO_WORKERS:-1}}
    volumes:
      - type: bind
        source: ${MEDIA_PATH:-./media}
        target: /media
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKEND_STATE_PATH:-${WEB_STATE_PATH:-/var/lib/homelab/stt-to-subtitle/web-state}}
        target: /var/lib/stt
        bind:
          create_host_path: false
      - type: bind
        source: ${BACKEND_WORK_PATH:-${WEB_WORK_PATH:-/data/work/stt-to-subtitle/web-jobs}}
        target: /var/lib/stt-work
        bind:
          create_host_path: false
      - type: bind
        source: ${TRANSLATION_STATE_PATH:-/var/lib/homelab/stt-to-subtitle/translation-state}
        target: /var/lib/stt-translation
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - app
      - runtime

  runtime:
    platform: linux/amd64
    build:
      context: ${WORKSPACE:-.}
      dockerfile: Dockerfile.runtime
      args:
        STT_RUNTIME_BASE_IMAGE: ${STT_RUNTIME_BASE_IMAGE:-${STT_RUNTIME_IMAGE:-stt-to-subtitle-runtime-base:py311-cuda-v4}}
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    expose:
      - "8100"
    environment:
      HF_TOKEN: ${HF_TOKEN:?HF_TOKEN must be set}
      STT_HOST: 0.0.0.0
      STT_PORT: 8100
      STT_RUNTIME_ID: ${STT_RUNTIME_ID:-builtin}
      STT_RUNTIME_NAME: ${STT_RUNTIME_NAME:-기본 Runtime}
      STT_API_TOKEN: ${STT_API_TOKEN:-}
      STT_STATE_DIR: /var/lib/stt
      STT_WORK_DIR: /var/lib/stt-work
      STT_DEVICE: ${STT_DEVICE:-cuda}
      STT_DIARIZATION_DEVICE: ${STT_DIARIZATION_DEVICE:-cuda}
      STT_BATCH_SIZE: ${STT_BATCH_SIZE:-8}
      WHISPERX_BATCH_SIZE: ${WHISPERX_BATCH_SIZE:-8}
      STT_THREADS: ${STT_THREADS:-8}
      STT_PROGRESS_INTERVAL_SECONDS: ${STT_PROGRESS_INTERVAL_SECONDS:-30}
      STT_CHUNK_PROGRESS_EVERY: ${STT_CHUNK_PROGRESS_EVERY:-10}
      STT_MODEL_IDLE_TIMEOUT_SECONDS: ${STT_MODEL_IDLE_TIMEOUT_SECONDS:-900}
      STT_NOISE_FILTER_TRIGGER_LEVEL: ${STT_NOISE_FILTER_TRIGGER_LEVEL:-7.0}
      STT_DEBUG_ARTIFACTS: ${STT_DEBUG_ARTIFACTS:-false}
      HF_HOME: /var/cache/stt/huggingface
      PYANNOTE_CACHE: /var/cache/stt/pyannote
      TORCH_HOME: /var/cache/stt/torch
      WHISPERX_PYTHON: /opt/venvs/whisperx/bin/python
      WHISPERJAV_PYTHON: /opt/venvs/whisperjav/bin/python
      WHISPERX_MODEL: ${WHISPERX_MODEL:-large-v3}
      WHISPERX_LANGUAGE: ${WHISPERX_LANGUAGE:-ja}
      WHISPERX_COMPUTE_TYPE: ${WHISPERX_COMPUTE_TYPE:-float16}
      WHISPERX_CACHE_DIR: /var/cache/stt/whisperx
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - type: bind
        source: ${STT_STATE_PATH:-/var/lib/homelab/stt-to-subtitle/stt-state}
        target: /var/lib/stt
        bind:
          create_host_path: false
      - type: bind
        source: ${STT_WORK_PATH:-/data/work/stt-to-subtitle/stt-incoming}
        target: /var/lib/stt-work
        bind:
          create_host_path: false
      - type: bind
        source: ${MODEL_CACHE_PATH:-/data/models/stt-to-subtitle}
        target: /var/cache/stt
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=1g,mode=1777
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
    networks:
      - runtime

networks:
  app:
  runtime:
  traefik:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true
