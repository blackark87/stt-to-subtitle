name: stt-to-subtitle

services:
  web:
    container_name: stt-web
    platform: linux/amd64
    build:
      context: ${WORKSPACE:-.}
      dockerfile: Dockerfile.web
    user: "${WEB_PUID:-1026}:${WEB_PGID:-100}"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      stt:
        condition: service_healthy
        restart: true
    expose:
      - "8080"
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-proxy}
      traefik.http.routers.stt-to-subtitle.rule: "Host(`${TRAEFIK_HOST:?TRAEFIK_HOST must be set}`)"
      traefik.http.routers.stt-to-subtitle.entrypoints: ${TRAEFIK_ENTRYPOINT:-websecure}
      traefik.http.routers.stt-to-subtitle.tls: "true"
      traefik.http.routers.stt-to-subtitle.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      traefik.http.routers.stt-to-subtitle.service: stt-to-subtitle
      traefik.http.services.stt-to-subtitle.loadbalancer.server.port: "8080"
    environment:
      MEDIA_ROOT: /media
      WEB_STATE_DIR: /var/lib/stt
      WEB_ADMIN_PASSWORD: ${WEB_ADMIN_PASSWORD:-}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:-}
      WEB_SECURE_COOKIE: ${WEB_SECURE_COOKIE:-true}
      WEB_FORWARDED_ALLOW_IPS: "${WEB_FORWARDED_ALLOW_IPS:-*}"
      STT_BASE_URL: http://stt:8100
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_TOKEN: ${OPENAI_COMPATIBLE_TOKEN:-}
      OPENAI_COMPATIBLE_MODEL: ${OPENAI_COMPATIBLE_MODEL:-}
      TRANSLATION_BATCH_SEGMENTS: ${TRANSLATION_BATCH_SEGMENTS:-30}
      TRANSLATION_BATCH_CHARACTERS: ${TRANSLATION_BATCH_CHARACTERS:-6000}
    volumes:
      - ${MEDIA_PATH:-./media}:/media:rw
      - type: bind
        source: ${WEB_STATE_PATH:-/data/stt-to-subtitle/web-state}
        target: /var/lib/stt
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - default
      - traefik

  stt:
    container_name: stt-backend
    platform: linux/amd64
    build:
      context: ${WORKSPACE:-.}
      dockerfile: Dockerfile
    user: "${PUID:-1000}:${PGID:-1000}"
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      HF_TOKEN: ${HF_TOKEN:?HF_TOKEN must be set}
      STT_HOST: 0.0.0.0
      STT_PORT: 8100
      STT_STATE_DIR: /var/lib/stt
      STT_DEVICE: ${STT_DEVICE:-cuda}
      STT_DIARIZATION_DEVICE: ${STT_DIARIZATION_DEVICE:-cuda}
      STT_BATCH_SIZE: ${STT_BATCH_SIZE:-1}
      STT_PROGRESS_INTERVAL_SECONDS: ${STT_PROGRESS_INTERVAL_SECONDS:-30}
      STT_CHUNK_PROGRESS_EVERY: ${STT_CHUNK_PROGRESS_EVERY:-10}
      STT_NOISE_FILTER_TRIGGER_LEVEL: ${STT_NOISE_FILTER_TRIGGER_LEVEL:-7.0}
      STT_DEBUG_ARTIFACTS: ${STT_DEBUG_ARTIFACTS:-false}
      HF_HOME: /var/cache/stt/huggingface
      PYANNOTE_CACHE: /var/cache/stt/pyannote
      TORCH_HOME: /var/cache/stt/torch
      WHISPERX_PYTHON: /opt/venvs/whisperx/bin/python
      WHISPERX_MODEL: ${WHISPERX_MODEL:-large-v3}
      WHISPERX_LANGUAGE: ${WHISPERX_LANGUAGE:-ja}
      WHISPERX_COMPUTE_TYPE: ${WHISPERX_COMPUTE_TYPE:-float16}
      WHISPERX_CACHE_DIR: /var/cache/stt/whisperx
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - type: bind
        source: ${STT_STATE_PATH:-/data/stt-to-subtitle/stt-state}
        target: /var/lib/stt
      - type: bind
        source: ${MODEL_CACHE_PATH:-/data/stt-to-subtitle/model}
        target: /var/cache/stt
    tmpfs:
      - /tmp:size=1g,mode=1777
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true
