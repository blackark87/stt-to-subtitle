{% import "_icons.html" as icons %}
<div class="stat-strip">
  <a class="stat-tile stat-running" href="/jobs?status_group=running">
    <span class="stat-icon">{{ icons.activity(18) }}</span>
    <span class="stat-value">{{ job_stats.running }}</span>
    <span class="stat-label">진행 중</span>
  </a>
  <a class="stat-tile stat-attention" href="/jobs?status_group=attention">
    <span class="stat-icon">{{ icons.alert_triangle(18) }}</span>
    <span class="stat-value">{{ job_stats.attention }}</span>
    <span class="stat-label">확인 필요</span>
  </a>
  <a class="stat-tile stat-waiting" href="/jobs?status_group=waiting">
    <span class="stat-icon">{{ icons.clock(18) }}</span>
    <span class="stat-value">{{ job_stats.waiting }}</span>
    <span class="stat-label">대기</span>
  </a>
  <a class="stat-tile stat-completed" href="/jobs?status_group=completed">
    <span class="stat-icon">{{ icons.check(18) }}</span>
    <span class="stat-value">{{ job_stats.completed }}</span>
    <span class="stat-label">완료</span>
  </a>
</div>
