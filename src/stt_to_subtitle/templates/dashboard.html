{% extends "base.html" %}
{% block title %}작업 대시보드 · STT to Subtitle{% endblock %}
{% block content %}
  <h1>자막 작업</h1>
  <p class="muted">NAS가 오디오를 추출하고, Mac 전사 API와 별도 LM Studio PC를 순서대로 호출합니다.</p>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}

  <section class="card">
    <h2>새 작업</h2>
    <form method="post" action="/jobs" class="grid-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="wide">미디어 파일
        <select name="source_rel" required>
          {% for file in files %}
            <option value="{{ file.path }}">
              {{ file.path }} · {{ file.size|filesize }}{% if file.has_subtitle %} · SRT 있음{% endif %}
            </option>
          {% else %}
            <option value="" disabled>MEDIA_ROOT에 지원 파일이 없습니다</option>
          {% endfor %}
        </select>
      </label>
      <label>오디오 스트림
        <input name="audio_stream" type="number" min="0" value="0" required>
      </label>
      <label>시작(초)
        <input name="start_seconds" type="number" min="0" step="0.1" value="0" required>
      </label>
      <label>길이(초)
        <input name="duration_seconds" type="number" min="0" step="0.1" placeholder="비우거나 0 = 끝까지">
      </label>
      <label>청크(초)
        <input name="chunk_length_seconds" type="number" min="1" value="15" required>
      </label>
      <label>화자 수
        <input name="num_speakers" type="number" min="1" placeholder="자동">
      </label>
      <label>최소 화자
        <input name="min_speakers" type="number" min="1" placeholder="자동">
      </label>
      <label>최대 화자
        <input name="max_speakers" type="number" min="1" placeholder="자동">
      </label>
      <label class="check"><input name="add_punctuation" type="checkbox"> 일본어 구두점 모델 사용</label>
      <label class="check"><input name="force_overwrite" type="checkbox"> 기존 <code>.ko.srt</code> 강제 덮어쓰기</label>
      <div class="wide"><button type="submit" {% if not files %}disabled{% endif %}>작업 시작</button></div>
    </form>
  </section>

  <section class="card">
    <h2>최근 작업</h2>
    <div data-poll-url="/jobs-fragment" data-poll-seconds="5">
      {% include "_jobs_table.html" %}
    </div>
  </section>
{% endblock %}
