{% macro avatar(actor, size=36) %}
  <span class="actor-avatar{% if size != 36 %} size-{{ size }}{% endif %}">
    {% if actor and actor.image_path %}
      <img
        src="{{ url_for('media_actor_image', actor_path=actor.image_path) }}"
        alt="{{ actor.name }}"
        loading="lazy"
      >
    {% else %}
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" fill="currentColor" opacity=".08"/>
        <circle cx="20" cy="15.4" r="6.6" fill="currentColor" opacity=".28"/>
        <path d="M6.4 40c1.7-7.7 7.1-11.7 13.6-11.7S32 32.3 33.6 40Z" fill="currentColor" opacity=".28"/>
      </svg>
    {% endif %}
  </span>
{% endmacro %}
