<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}STT to Subtitle{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
    <script defer src="{{ url_for('static', path='/poll.js') }}"></script>
    {% block head %}{% endblock %}
  </head>
  <body>
    <header class="topbar">
      <a href="/" class="brand">STT to Subtitle</a>
      {% if request.app.state.authentication_enabled and request.session.get("authenticated") %}
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{ request.session.get('csrf_token') }}">
          <button type="submit" class="secondary">로그아웃</button>
        </form>
      {% endif %}
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
