<nav class="job-filter-panel" aria-label="작업 목록 필터">
  <div class="job-filter-heading">
    <strong>작업 필터</strong>
    {% if job_filters_active %}<a href="{{ job_filters_clear_url }}">전체 초기화</a>{% endif %}
  </div>
  {% for group in job_filter_groups %}
    <div class="job-filter-row" data-filter-dimension="{{ group.key }}">
      <span class="job-filter-label">{{ group.label }}</span>
      <div class="job-filter-options">
        <a
          class="button secondary compact{% if not group.selected %} is-filter-active{% endif %}"
          href="{{ group.clear_url }}"
        >전체</a>
        {% for option in group.options %}
          <a
            class="button secondary compact{% if option.selected %} is-filter-active{% endif %}"
            href="{{ option.url }}"
            {% if option.selected %}aria-current="page"{% endif %}
          >
            <span>{{ option.label }}</span>
            <span class="job-filter-count" aria-label="{{ option.count }}건">{{ option.count }}</span>
          </a>
        {% endfor %}
      </div>
    </div>
  {% endfor %}
</nav>
