{% extends "base.html" %}
{% block title %}로그인 · STT to Subtitle{% endblock %}
{% block content %}
  <section class="card narrow">
    <div class="page-heading login-heading">
      <div>
        <p class="page-kicker">SIGN IN</p>
        <h1>자막 작업 관리자</h1>
      </div>
    </div>
    {% if error %}<p class="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="stack">
      <label>비밀번호
        <input type="password" name="password" required autofocus>
      </label>
      <div class="submit-row"><button type="submit">로그인</button></div>
    </form>
  </section>
{% endblock %}
