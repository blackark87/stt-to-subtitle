{% extends "base.html" %}
{% block title %}{{ job.source_rel }} · STT to Subtitle{% endblock %}
{% block head %}
  <script defer src="{{ url_for('static', path='/vr180-player.js') }}"></script>
  <script defer src="{{ url_for('static', path='/player.js') }}"></script>
{% endblock %}
{% block content %}
  <p><a href="/">← 대시보드</a></p>
  <h1>{{ job.source_rel }}</h1>
  <div
    {% if job.status not in ["completed", "blocked", "failed"] %}
      data-poll-url="/jobs/{{ job.id }}/panel"
      data-poll-seconds="5"
    {% endif %}
  >
    {% include "_job_panel.html" %}
  </div>
{% endblock %}
