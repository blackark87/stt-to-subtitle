global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: dcgm-exporter
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - dcgm-exporter:9400

  - job_name: stt-to-subtitle-backend
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /api/v1/operations/metrics/prometheus
    static_configs:
      - targets:
          - backend:8080
