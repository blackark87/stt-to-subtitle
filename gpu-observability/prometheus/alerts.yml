groups:
  - name: gpu-health
    rules:
      - alert: GPUExporterUnavailable
        expr: up{job="dcgm-exporter"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "GPU 메트릭 수집기가 응답하지 않습니다"
          description: "Prometheus가 {{ $labels.instance }}의 DCGM Exporter를 2분 이상 수집하지 못했습니다."

      - alert: GPUHighTemperature
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GPU 온도가 높습니다"
          description: "GPU {{ $labels.gpu }} 온도가 10분 이상 85°C를 초과했습니다 (현재 {{ $value }}°C)."

      - alert: GPUMemoryNearlyFull
        expr: 100 * DCGM_FI_DEV_FB_USED / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 95
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GPU 메모리가 거의 찼습니다"
          description: "GPU {{ $labels.gpu }} 메모리 사용률이 10분 이상 95%를 초과했습니다."

      - alert: GPUXidError
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "NVIDIA GPU XID 오류가 감지되었습니다"
          description: "GPU {{ $labels.gpu }}에서 XID {{ $value }} 오류가 보고되었습니다."
